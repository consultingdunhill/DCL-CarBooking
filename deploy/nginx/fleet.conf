# The server's own nginx: /etc/nginx/conf.d/fleet.conf. certbot --nginx adds the TLS
# half to this file. Everything goes to the web container on loopback, which serves the
# app and passes /api on to the API.
server {
    listen 80;
    server_name fleet.erp.dunhill-ticketing.com;

    # Odometer and receipt photos (the API allows 15 MB).
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live trip updates are server-sent events: no buffering, and a long read timeout.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
