# The web container: the built app, and /api passed on to the API container with the
# prefix taken off. The server's own nginx terminates TLS in front of this.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Odometer and receipt photos go up through /api/uploads (the API allows 15 MB).
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Resolve the API through Docker's DNS on each request, so a recreated API container
    # (new address) is found without restarting this one.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:4000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # /api/live/stream is server-sent events: no buffering, and a long read timeout.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Hashed file names: safe to cache for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The shell and the service worker must always be fresh, or a release never arrives.
    location ~ ^/(index\.html|sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Client-side routes (/trips/…, /admin/…) all load the app.
    location / {
        try_files $uri /index.html;
    }
}
