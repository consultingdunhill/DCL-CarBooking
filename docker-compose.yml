services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: carbooking
      POSTGRES_PASSWORD: carbooking
      POSTGRES_DB: carbooking
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/docker/skip-postgis-init.sh:/docker-entrypoint-initdb.d/10_postgis.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbooking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
